<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aceh Explorer - Fullscreen Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Fullscreen Map Container -->
    <div id="map"></div>

    <!-- Map Type Switcher (Bottom Right) -->
    <div class="map-controls">
        <div class="map-type-switcher">
            <button class="map-type-btn active" data-type="dark">Dark</button>
            <button class="map-type-btn" data-type="light">Light</button>
            <button class="map-type-btn" data-type="satellite">Satellite</button>
        </div>
    </div>

    <!-- UI Overlay Layer -->
    <div class="ui-overlay">
        <!-- Top Left: Places List -->
        <div class="places-container">
            <div class="card-title" style="margin-top: 0;">Daftar Tempat</div>
            <div id="places-list" class="places-list-wrapper">
                <!-- Items will be injected here via JS -->
            </div>
            
            <!-- Pagination Controls -->
            <div id="pagination" class="pagination-container">
                <button id="prev-page" class="pager-btn" disabled>&larr;</button>
                <span id="page-info">Halaman 1</span>
                <button id="next-page" class="pager-btn">&rarr;</button>
            </div>
        </div>

        <aside class="sidebar">
            <header>
                <h1>Aceh Explorer</h1>
                <p class="subtitle">Temukan & bagikan tempat menarik di Banda Aceh secara real-time.</p>
            </header>

            <div class="card-title">
                Tambah Tempat Baru
            </div>

            <div class="form-container">
                <div class="input-group">
                    <label for="place-name">Nama Tempat</label>
                    <input type="text" id="place-name" placeholder="Misal: Museum Tsunami">
                </div>
                
                <div class="input-group">
                    <label for="place-desc">Deskripsi</label>
                    <textarea id="place-desc" placeholder="Apa yang spesial dari tempat ini?"></textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label for="place-lat">Latitude</label>
                        <input type="number" id="place-lat" step="any" placeholder="5.5xxx">
                    </div>
                    <div class="input-group" style="margin-bottom: 0;">
                        <label for="place-lng">Longitude</label>
                        <input type="number" id="place-lng" step="any" placeholder="95.3xxx">
                    </div>
                </div>

                <button id="add-place-btn" class="btn-primary">
                    Simpan Lokasi
                </button>
            </div>

            <div class="tip-box">
                <p><strong>Tips:</strong> Klik area manapun di peta untuk mengambil koordinat secara presisi.</p>
            </div>
        </aside>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Custom JS -->
    <script src="map.js"></script>
</body>
</html>
